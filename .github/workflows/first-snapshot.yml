# Temporary: runs the collector on this branch to produce the first collected snapshot (run 3). Removed before merge.
name: First snapshot (temporary)
on:
  push:
    branches: [claude/project-thread-jmcurz]
    paths: [.github/workflows/first-snapshot.yml]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          DATE=$(date -u +%F)
          python3 scripts/collect_snapshot.py --date "$DATE" 2> collect.log || { tail -50 collect.log; exit 1; }
          tail -30 collect.log
          python3 scripts/snapshot_summary.py "$DATE" | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data && git commit -m "Add first collected snapshot $DATE" && git push
