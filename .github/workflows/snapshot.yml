name: Biweekly snapshot

# Every Monday the job checks the age of the latest snapshot and collects a new
# one once it is 13 days old or more, so a snapshot lands every two weeks.
# The new snapshot arrives as a pull request to review and merge.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Collect now even if the latest snapshot is recent"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency: snapshot

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect signals
        id: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%F)
          MIN=13
          if [ "${{ inputs.force }}" = "true" ]; then MIN=0; fi
          python3 scripts/collect_snapshot.py --date "$DATE" --min-days "$MIN"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          if [ -n "$(git status --porcelain data)" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Summarise
        if: steps.collect.outputs.changed == 'true'
        run: |
          python3 scripts/snapshot_summary.py "${{ steps.collect.outputs.date }}" > "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open pull request
        if: steps.collect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="${{ steps.collect.outputs.date }}"
          BRANCH="snapshot/$DATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data
          git commit -m "Add snapshot $DATE"
          git push -u origin "$BRANCH" --force
          gh pr create --base main --head "$BRANCH" --title "Snapshot $DATE" --body-file "$RUNNER_TEMP/body.md" \
            || echo "::warning::Branch $BRANCH is pushed but the PR could not be opened. Enable Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests', or open it by hand."
